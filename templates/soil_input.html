{% extends "base.html" %}
{% block title %}Soil Report{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0 fw-bold">Enter Soil Test Report</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Soil pH *</label>
                            <input type="number" step="0.1" name="soil_ph" class="form-control" value="5.5" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Organic Carbon (%)</label>
                            <input type="number" step="0.1" name="organic_carbon_pct" class="form-control" value="1.8">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Nitrogen (kg/ha) *</label>
                            <input type="number" name="nitrogen_kg_ha" class="form-control" value="220" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Phosphorus (kg/ha) *</label>
                            <input type="number" name="phosphorus_kg_ha" class="form-control" value="18" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Potassium (kg/ha) *</label>
                            <input type="number" name="potassium_kg_ha" class="form-control" value="210" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Zinc (ppm)</label>
                            <input type="number" step="0.1" name="zinc_ppm" class="form-control" value="1.2">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Boron (ppm)</label>
                            <input type="number" step="0.1" name="boron_ppm" class="form-control" value="0.4">
                        </div>
                        
                        <!-- NEW FIELDS ADDED HERE -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Soil Moisture Level</label>
                            <select name="soil_moisture" class="form-select">
                                <option value="Low">Low (Dry)</option>
                                <option value="Medium" selected>Medium (Normal)</option>
                                <option value="High">High (Wet)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Soil Texture</label>
                            <select name="soil_texture" class="form-select">
                                <option value="Sandy">Sandy (Fast draining)</option>
                                <option value="Loamy" selected>Loamy (Ideal)</option>
                                <option value="Clay">Clay (Holds water)</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">Save Soil Report</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
