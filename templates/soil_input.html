{% extends "base.html" %}
{% block title %}Soil Report{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Enter Soil Test Report</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Soil pH *</label>
                            <input type="number" step="0.1" name="soil_ph" class="form-control" value="5.5" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Organic Carbon (%)</label>
                            <input type="number" step="0.1" name="organic_carbon_pct" class="form-control" value="1.8">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nitrogen (kg/ha) *</label>
                            <input type="number" name="nitrogen_kg_ha" class="form-control" value="220" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Phosphorus (kg/ha) *</label>
                            <input type="number" name="phosphorus_kg_ha" class="form-control" value="18" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Potassium (kg/ha) *</label>
                            <input type="number" name="potassium_kg_ha" class="form-control" value="210" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Zinc (ppm)</label>
                            <input type="number" step="0.1" name="zinc_ppm" class="form-control" value="1.2">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Boron (ppm)</label>
                            <input type="number" step="0.1" name="boron_ppm" class="form-control" value="0.4">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Save Soil Report</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
